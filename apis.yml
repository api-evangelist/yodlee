- aid: yodlee:yodlee-payment-processor-api
  name: Yodlee Payment Processor API
  description: >-
    Yodlee's payment processor partners can use the Payment Processor endpoints to access verified account
    details using the <code>processorToken</code> created and shared by mutual customers. These APIs are
    only for payment processor partners and not for developers using the Yodlee services to integrate
    with payment partners. Refer <a href="/products/yodlee/account-token/docs#customers"> here </a> for
    a guide on working with payment processor partners.<br>As a processor payment partner, you can retrieve
    the following account information using the <code>processorToken</code>:<ul><li>Account details include
    account status, account name, full account number, bank transfer code, balance, etc.</li><li>Account
    holder details include name, email, phone number, address, etc.</li><li>Account balance details.</li></ul><br>You
    will have to set the header before making the API call. The following headers apply to all the APIs:</p><ul><li>Authorization:
    This header holds the access token</li> </ul><b>Note</b>: If there are any API-specific headers, they
    are mentioned explicitly in the respective API's description.<p></p>
  humanURL: https://developer.yodlee.com/resources/yodlee/yodlee-api-overview/docs/overview
  baseURL: https://production.api.yodlee.com/ysl
