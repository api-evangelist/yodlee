apis:
- aid: yodlee:yodlee-account-verification-api
  name: Yodlee Account Verification API
  description: >-
    The Yodlee Account Verification API enables real-time verification of bank account ownership and balance.
    Supports verification workflows via FastLink 4, holder profile retrieval, verified account status,
    and account classification summaries.
  humanURL: https://developer.yodlee.com/products/yodlee/account-aggregation/docs/api-reference
  baseURL: https://production.api.yodlee.com/ysl
  tags:
  - Account Verification
  - Banking
  - Fintech
  - KYC
  properties:
  - type: Documentation
    url: https://developer.yodlee.com/products/yodlee/account-aggregation/docs/api-reference
- aid: yodlee:yodlee-fastlink
  name: Yodlee FastLink
  description: >-
    FastLink 4 is Yodlee's white-label account aggregation widget that enables users to securely link
    their financial accounts. Provides a customizable embedded UI for account login, MFA, account selection,
    verification, and consent management.
  humanURL: https://developer.yodlee.com/
  tags:
  - Account Linking
  - Widget
  - Embedded Finance
  properties:
  - type: Documentation
    url: https://developer.yodlee.com/
- aid: yodlee:yodlee-account-token-api
  name: Yodlee Account Token API
  description: >-
    Account verification customers looking to integrate with one of our payment partners can use the Account
    Token endpoints. These APIs allow creating a secure processor token for your user's verified financial
    accounts. You can then share the processor token with our payment partners to enable them to securely
    request the user's account details from Yodlee.<br><br>You will have to set the header before making
    the API call. The following headers apply to all the APIs:</p><ul><li>Authorization: This header holds
    the access token</li> <li> Api-Version: 1.1</li></ul><b>Note</b>: If there are any API-specific headers,
    they are mentioned explicitly in the respective API's description.<p></p>
  humanURL: https://developer.yodlee.com/resources/yodlee/yodlee-api-overview/docs/overview
  baseURL: https://production.api.yodlee.com/ysl
  tags:
  - Account Token
  properties:
