findings:
- register: Bank of Canada RPAA registry of payment service providers
  registered_name: Yodlee, Inc.
  brand: Yodlee, Inc.
  register_status: refused
  register_id: 970593ac-4ca0-ef11-a72d-6045bd5ed05c
  evidence_url: https://www.bankofcanada.ca/core-functions/retail-payments-supervision/psp-registry/psp-registry-details/?account_id=970593ac-4ca0-ef11-a72d-6045bd5ed05c
  matched_domain: yodlee.com
  matched_by: domain
  reasons:
  - published_date: June 17, 2026
    authority:
    - Retail Payment Activities Act (RPAA) 48(1) / Retail Payment Activities Regulations (RPAR) 30(b)(ii)) – The RPAA does
      not apply to the applicant or in respect of any payment functions that they perform or plan to perform
    reason: Yodlee Inc. submitted a registration application to the Bank of Canada on November 13, 2024. During the assessment
      of the application, the Bank identified that Yodlee Inc. does not perform payment functions. As a result, the RPAA does
      not apply to Yodlee Inc. Based on these facts, the Bank refused Yodlee Inc.’s application for registration pursuant
      to subsection 48(1) of the RPAA and subparagraph 30(b)(ii) of the RPAR. A Notice of refusal was issued on May 6, 2026.
      Yodlee Inc. did not exercise its rights to a review under subsection 50(1) of the RPAA. Yodlee Inc. a présenté une demande
      d’enregistrement à la Banque du Canada (la Banque) le 13 novembre 2024. Dans le cadre de l’évaluation de la demande,
      la Banque a déterminé que Yodlee Inc. n’exécute pas de fonctions de paiement. Par conséquent, Yodlee Inc. n’entre pas
      dans le champ d’application de la LAAPD. Compte tenu de ces faits, la Banque a refusé la demande d’enregistrement de
      Yodlee Inc. en vertu du paragraphe 48(1) de la LAAPD et du sous-alinéa 30b)(ii) du Règlement . Un avis de refus a été
      donné le 6 mai 2026. Yodlee Inc. n’a pas demandé de révision en vertu du paragraphe 50(1) de la LAAPD.
  negative_finding: true
note: A refusal or revocation under the Retail Payment Activities Act is a negative regulated finding; it is recorded here
  and is NOT an integration edge (it never counts toward participation).
