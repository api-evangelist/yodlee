          readOnly: true
          type: string
        accountType:
          description: 'AccountType supported by the provider, eg: Brokerage Cash, Current<br><br><b>Endpoints</b>:<ul><li>GET providers/{providerId}</li><li>GET providers</li></ul>'
          readOnly: true
          type: array
          items:
            type: string
            enum:
            - CURRENT
            - BROKERAGE_CASH
