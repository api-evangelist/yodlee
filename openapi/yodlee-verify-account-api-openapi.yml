        - PAYMENT
        - PAYOFF
        - UNKNOWN
  Name:
    type: object
    title: Name
    properties:
      middle:
        description: Middle name.
        type: string
      last:
        description: Last name.
        type: string
      fullName:
        description: Full name.
        type: string
      first:
        description: First name.
